name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Dependency audit (fail on critical)
        run: npm audit --audit-level=critical
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.invalid
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility checks
        run: npm run e2e
        env:
          NEXT_PUBLIC_SITE_URL: https://example.invalid
