name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Dependency audit (fail on critical)
        run: npm audit --audit-level=critical
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.invalid
      - name: CSP hash manifest is current
        # The proxy carries the manifest as a compiled module, so the two-pass
        # release build is what production runs. `--check` fails when the committed
        # manifest does not describe this build, which is the failure that would
        # otherwise only show up as pages that never hydrate on a host without the
        # build output on disk.
        run: |
          node scripts/generate-csp-hashes.mjs
          npx next build
          node scripts/generate-csp-hashes.mjs --check
        env:
          NEXT_PUBLIC_SITE_URL: https://example.invalid
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility checks
        run: npm run e2e
        env:
          NEXT_PUBLIC_SITE_URL: https://example.invalid
